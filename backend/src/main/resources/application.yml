server:
  port: 8013
  shutdown: graceful

spring:
  application:
    name: ai-decision-map-api
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://218.156.22.171:9001/ai_decision_map?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&sslMode=PREFERRED&connectTimeout=5000&socketTimeout=10000}
    username: ${MYSQL_USERNAME:decision_map_app}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:10}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${MYSQL_VALIDATION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3007}
  llm:
    provider: ${LLM_PROVIDER:openai}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    conversation-model: ${LLM_CONVERSATION_MODEL:gpt-5.6-luna}
    narrative-model: ${LLM_NARRATIVE_MODEL:gpt-5.6-terra}
    conversation-reasoning-effort: ${LLM_CONVERSATION_REASONING_EFFORT:none}
    narrative-reasoning-effort: ${LLM_NARRATIVE_REASONING_EFFORT:low}
    prompt-version: ${LLM_PROMPT_VERSION:decision-coach-v4}
    conversation-max-output-tokens: ${LLM_CONVERSATION_MAX_OUTPUT_TOKENS:3500}
    narrative-max-output-tokens: ${LLM_NARRATIVE_MAX_OUTPUT_TOKENS:3500}
