upstream decision_map_web {
    server 127.0.0.1:3007;
    keepalive 16;
}

upstream decision_map_api {
    server 127.0.0.1:8013;
    keepalive 16;
}

server {
    listen 80;
    server_name decision.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name decision.example.com;

    ssl_certificate /etc/letsencrypt/live/decision.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/decision.example.com/privkey.pem;

    location /api/ {
        proxy_pass http://decision_map_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://decision_map_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
