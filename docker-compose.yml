name: ai-decision-map

# 로컬/서버 공용 구성. DB는 기존 외부 MySQL(기본 218.156.22.171:9001)을 사용합니다.
# 운영 서버에서는 docker-compose.prd.yml과 config/app.env를 사용하세요.
services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MYSQL_URL: ${MYSQL_URL:?MYSQL_URL is required}
      MYSQL_USERNAME: ${MYSQL_USERNAME:?MYSQL_USERNAME is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3007}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_CONVERSATION_MODEL: ${LLM_CONVERSATION_MODEL:-gpt-5.6-luna}
      LLM_NARRATIVE_MODEL: ${LLM_NARRATIVE_MODEL:-gpt-5.6-terra}
      LLM_CONVERSATION_REASONING_EFFORT: ${LLM_CONVERSATION_REASONING_EFFORT:-none}
      LLM_NARRATIVE_REASONING_EFFORT: ${LLM_NARRATIVE_REASONING_EFFORT:-low}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-decision-coach-v4}
      LLM_CONVERSATION_MAX_OUTPUT_TOKENS: ${LLM_CONVERSATION_MAX_OUTPUT_TOKENS:-3500}
      LLM_NARRATIVE_MAX_OUTPUT_TOKENS: ${LLM_NARRATIVE_MAX_OUTPUT_TOKENS:-3500}
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8013}:8013"
    networks:
      - decision-map

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL-http://localhost:8013}
    restart: unless-stopped
    environment:
      PORT: 3007
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-3007}:3007"
    networks:
      - decision-map

networks:
  decision-map:
    name: ai-decision-map
